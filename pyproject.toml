[project]
name = "book2audio"
version = "0.1.0"
description = "PDF, EPUB и FB2 в аудиокнигу m4b. Русский и английский, локальный синтез."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.1",
    "numpy>=2.0",
    "omegaconf>=2.3.1",
    "torch>=2.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["book2audio"]

[tool.pytest.ini_options]
markers = ["slow: требует сеть или веса моделей"]
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
