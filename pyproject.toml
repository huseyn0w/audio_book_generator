[project]
name = "book2audio"
version = "0.1.0"
description = "PDF, EPUB и FB2 в аудиокнигу m4b. Русский и английский, локальный синтез."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.7.22",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.1",
    "num2words>=0.5.14",
    "numpy>=2.0",
    "omegaconf>=2.3.1",
    "pymupdf>=1.28.2",
    "pysbd>=0.3.4",
    "python-multipart>=0.0.32",
    "torch>=2.14.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
book2audio = "book2audio.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["book2audio"]

[tool.pytest.ini_options]
markers = ["slow: требует сеть или веса моделей"]
asyncio_mode = "auto"
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
